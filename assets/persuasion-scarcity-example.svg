<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Scarcity: disclose a real workshop limit</title>
  <desc id="desc">A workshop registration card displays a clear closing date and fixed room capacity.</desc>
  <rect width="800" height="450" rx="28" fill="#f4eee8"/>
  <rect x="119" y="73" width="560" height="306" rx="22" fill="#fff" stroke="#4b596b" stroke-width="5"/>
  <rect x="119" y="73" width="560" height="75" rx="20" fill="#496f86"/>
  <text x="157" y="122" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">COMMUNITY WORKSHOP</text>
  <rect x="156" y="181" width="82" height="82" rx="12" fill="#f4d078"/>
  <path d="M156 207h82m-61-44v31m40-31v31" stroke="#4b596b" stroke-width="7" stroke-linecap="round"/>
  <text x="271" y="204" fill="#243b53" font-family="Arial,sans-serif" font-size="23" font-weight="700">Registration closes</text>
  <text x="271" y="238" fill="#52616b" font-family="Arial,sans-serif" font-size="21">June 15</text>
  <text x="156" y="307" fill="#243b53" font-family="Arial,sans-serif" font-size="21" font-weight="700">Room capacity: 24 people</text>
  <text x="156" y="343" fill="#52616b" font-family="Arial,sans-serif" font-size="18">A real limit, clearly explained</text>
  <circle cx="605" cy="239" r="34" fill="#dcebe4"/>
  <path d="M588 239l12 12 24-27" fill="none" stroke="#39735f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
